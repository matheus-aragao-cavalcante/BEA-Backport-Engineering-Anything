[project]
name = "backport-engineering-anything"
dynamic = ["version"]
description = "BEA (Backport Engineering Anything): a clean-room, game-agnostic pipeline that adapts your own extracted Nintendo Switch game data (assets, configs, binary patches) and repackages it as a LayeredFS mod."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "The BEA Contributors" }]
keywords = ["backport", "modding", "layeredfs", "ips", "nso", "texture", "homebrew"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]
dependencies = [
    "lz4>=4.3.3",
    "pillow>=11.3",
    "pyyaml>=6.0.2",
]

[project.urls]
Homepage = "https://github.com/matheus-aragao-cavalcante/BEA-Backport-Engineering-Anything"
Repository = "https://github.com/matheus-aragao-cavalcante/BEA-Backport-Engineering-Anything"
Issues = "https://github.com/matheus-aragao-cavalcante/BEA-Backport-Engineering-Anything/issues"
Changelog = "https://github.com/matheus-aragao-cavalcante/BEA-Backport-Engineering-Anything/blob/main/CHANGELOG.md"

[project.scripts]
bea = "bea.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "bea/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["bea"]

[tool.hatch.build.targets.sdist]
include = ["/bea", "/profiles", "/tests", "/docs", "/README.md", "/CHANGELOG.md", "/LICENSE", "/DISCLAIMER.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "ffmpeg: needs the external ffmpeg/ffprobe binaries (skipped when they are missing)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "E501", # line length is the formatter's job
]

[tool.ruff.lint.per-file-ignores]
# Tests feed look-alike characters (full-width digits, no-break spaces) on purpose.
"tests/**" = ["RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["bea"]

[tool.mypy]
python_version = "3.12"
files = ["bea"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["lz4", "lz4.*"]
ignore_missing_imports = true
